name: Build Windows Installer

# 手动触发：Actions 页面点 "Run workflow"，或用 push tag 触发。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          Copy-Item $exe.FullName "out/KuroCat-custom-skin-setup.exe"
          Write-Host "installer: $($exe.Name) $([math]::Round($exe.Length/1MB,2)) MB"

          # Portable: the raw release binary, no installer / no UAC / no wizard.
          $raw = "src-tauri/target/release/KuroCat.exe"
          if (-not (Test-Path $raw)) { throw "portable binary not found" }
          Copy-Item $raw "out/KuroCat-portable.exe"
          $r = Get-Item $raw
          Write-Host "portable: $($r.Name) $([math]::Round($r.Length/1MB,2)) MB"
          Write-Host "portable-sha256: $((Get-FileHash $raw -Algorithm SHA256).Hash)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-installer
          path: |
            out/KuroCat-custom-skin-setup.exe
            out/KuroCat-portable.exe
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/KuroCat-custom-skin-setup.exe
            out/KuroCat-portable.exe
          name: KuroCat 自定义形象版 ${{ github.ref_name }}
          body: |
            两个文件，任选其一。

            - **`KuroCat-portable.exe`** —— 绿色版，直接双击运行，不需要安装、不弹 UAC、不走向导。想替换已装版本，把它改名成 `KuroCat.exe` 覆盖过去即可（先退出程序）。
            - **`KuroCat-custom-skin-setup.exe`** —— NSIS 安装包。未签名，SmartScreen 会拦一次，选「更多信息 → 仍要运行」；装到受保护目录时可能弹 UAC。

            ### 换形象怎么用
            1. 启动一次，再**完全退出**（托盘右键退出）。
            2. 把 4 帧 PNG（`idle/blink/shy/happy`，建议 224×278 透明底）和 `skin.json` 放进 `%APPDATA%\kuro-cat-pet\skins\`。
            3. 重新启动，检测到 `idle.png` 即启用 2D 精灵形象。
            4. 不需要重新编译，换图即生效。

            `skin.json` 可选开关：`hands` / `tail` / `eyeGaze` / `blush`（默认全关，避免程序化部件穿帮）。

            数据目录是 `%APPDATA%\kuro-cat-pet`（Rust 端 `config.rs` 硬编码），不是 `com.kurocat.pet`。
          draft: false
          prerelease: true
