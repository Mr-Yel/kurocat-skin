name: Build Windows Installer

# 手动触发：Actions 页面点 "Run workflow"，或用 push tag 触发。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Collect artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $exe.FullName "out/KuroCat-custom-skin-setup.exe"
          Write-Host "artifact: $($exe.Name) $([math]::Round($exe.Length/1MB,2)) MB"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-installer
          path: out/KuroCat-custom-skin-setup.exe
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/KuroCat-custom-skin-setup.exe
          name: KuroCat 自定义形象版 ${{ github.ref_name }}
          body: |
            Windows x64 安装包（NSIS，未签名，SmartScreen 会拦一次，选「更多信息 → 仍要运行」）。

            ### 换形象怎么用
            1. 安装并启动一次，再**完全退出**（托盘右键退出），让程序生成 `%APPDATA%\com.kurocat.pet`。
            2. 把 4 帧 PNG（`idle/blink/shy/happy`，建议 224×278 透明底）和 `skin.json` 放进 `%APPDATA%\com.kurocat.pet\skins\`。
            3. 重新启动，检测到 `idle.png` 即启用 2D 精灵形象。
            4. 不需要重新编译，换图即生效。

            `skin.json` 可选开关：`hands` / `tail` / `eyeGaze` / `blush`（默认全关，避免程序化部件穿帮）。
          draft: false
          prerelease: true
