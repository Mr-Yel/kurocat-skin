name: Build Windows Installer

# 手动触发：Actions 页面点 "Run workflow"，或用 push tag 触发。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          Copy-Item $exe.FullName "out/KuroCat-custom-skin-setup.exe"
          Write-Host "installer: $($exe.Name) $([math]::Round($exe.Length/1MB,2)) MB"

          # Portable: the raw release binary, no installer / no UAC / no wizard.
          $raw = "src-tauri/target/release/KuroCat.exe"
          if (-not (Test-Path $raw)) { throw "portable binary not found" }
          Copy-Item $raw "out/KuroCat-portable.exe"
          $r = Get-Item $raw
          Write-Host "portable: $($r.Name) $([math]::Round($r.Length/1MB,2)) MB"
          Write-Host "portable-sha256: $((Get-FileHash $raw -Algorithm SHA256).Hash)"

          Copy-Item "character-upload.html" "out/character-upload.html"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-installer
          path: |
            out/KuroCat-custom-skin-setup.exe
            out/KuroCat-portable.exe
            out/character-upload.html
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/KuroCat-custom-skin-setup.exe
            out/KuroCat-portable.exe
            out/character-upload.html
          name: KuroCat 自定义形象版 ${{ github.ref_name }}
          body: |
            程序二选一，角色素材制作工具附带下载。

            - **`KuroCat-portable.exe`** —— 绿色版，直接双击运行，不需要安装、不弹 UAC、不走向导。想替换已装版本，把它改名成 `KuroCat.exe` 覆盖过去即可（先退出程序）。
            - **`KuroCat-custom-skin-setup.exe`** —— NSIS 安装包。未签名，SmartScreen 会拦一次，选「更多信息 → 仍要运行」；装到受保护目录时可能弹 UAC。
            - **`character-upload.html`** —— 离线角色素材制作页，填写并上传素材后可下载角色 ZIP。

            ### 新增角色
            1. 用 `character-upload.html` 制作角色 ZIP，或直接准备一个带 `character.json` 的角色目录。
            2. 把角色目录放到 `%APPDATA%\kuro-cat-pet\skins\<角色目录名>\`。
            3. 在 `%APPDATA%\kuro-cat-pet\skins\characters.json` 的 `characters` 数组里登记该目录。
            4. 完全退出 KuroCat 后重新启动，在右键菜单「外观 → 角色外观」里选择角色。

            同时兼容旧式根目录四帧素材：`idle.png` / `blink.png` / `shy.png` / `happy.png` 和可选的 `skin.json`。

            数据目录是 `%APPDATA%\kuro-cat-pet`。本自定义构建已禁用官方在线更新，避免更新后覆盖定制功能。
          draft: false
          prerelease: true
